name: CMake Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Conan
        run: pip install --quiet conan

      # 【优化】为 Linux 的 Conan 依赖建立持久化缓存，避免每次都可能发生的漫长编译
      - name: Conan Cache
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: ${{ runner.os }}-conan-${{ hashFiles('conandata.yml', 'conanfile.txt', 'conanfile.py') }}
          restore-keys: |
            ${{ runner.os }}-conan-

      - name: Install deps via Conan
        run: |
          conan profile detect --force
          # 【修正】显式指定输出目录为 build，让生成器文件位置固定
          conan install . --build=missing -s build_type=Release -s os=Linux -s arch=x86_64 --output-folder=build

      - name: Configure
        run: |
          # 【修正】将 toolchain 路径指向 Conan 真正生成的 generators 目录
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=build/build/Release/generators/conan_toolchain.cmake

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Conan
        run: pip install --quiet conan

      # 【优化】为 Windows 的 Conan 依赖建立持久化缓存
      - name: Conan Cache
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: ${{ runner.os }}-conan-${{ hashFiles('conandata.yml', 'conanfile.txt', 'conanfile.py') }}
          restore-keys: |
            ${{ runner.os }}-conan-

      - name: Install deps via Conan
        shell: pwsh
        run: |
          conan profile detect --force
          # 【修正】显式指定输出目录为 build
          conan install . --build=missing -s build_type=Release -s os=Windows -s arch=x86_64 --output-folder=build

      - name: Configure
        shell: pwsh
        run: |
          # 【修正】Windows 下路径同样指向正确的 generators 目录
          cmake -B build
            -DCMAKE_BUILD_TYPE=Release
            -DCMAKE_TOOLCHAIN_FILE=build/build/Release/generators/conan_toolchain.cmake

      - name: Build
        shell: pwsh
        run: cmake --build build --parallel

      - name: Test
        shell: pwsh
        run: ctest --test-dir build --output-on-failure