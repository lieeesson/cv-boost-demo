name: CMake Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # =========================================================================
  # 1. 专门安装和构建 Conan 依赖的 Job。编译完立刻通过 Artifact 锁死生成文件
  # =========================================================================
  conan-deps:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Conan
        run: pip install --quiet conan

      - name: Install Build Tools (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      # 缓存巨型的二进制源码包（~/.conan2/p 只有这里在跑完后才写入/读取缓存）
      - name: Conan Binary Cache
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: ${{ matrix.os }}-conan-p-${{ hashFiles('conandata.yml', 'conanfile.txt', 'conanfile.py') }}
          restore-keys: |
            ${{ matrix.os }}-conan-p-

      - name: Install deps via Conan
        shell: bash
        run: |
          conan profile detect --force
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            conan install . --build=missing -s build_type=Release -s os=Linux -s arch=x86_64 -o opencv/*:with_ffmpeg=False -o opencv/*:with_gtk=False --output-folder=build
          else
            conan install . --build=missing -s build_type=Release -s os=Windows -s arch=x86_64 -o opencv/*:with_ffmpeg=False --output-folder=build
          fi

      # 【核心改动】将 Conan 刚刚在本地生成的 build 目录和 Presets 强行上传为 Artifact
      - name: Upload Build Folder & Presets
        uses: actions/upload-artifact@v4
        with:
          name: build-assets-${{ matrix.os }}
          path: |
            build/
            CMakeUserPresets.json
          retention-days: 1

  # =========================================================================
  # 2. 编译与测试 Job。报错后重跑时，上一步因为有 cache 依然是秒过，且这里能拿到最新的文件
  # =========================================================================
  build-and-test:
    needs: conan-deps
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # 【核心改动】强行把上一步生成的 build 文件夹和预设文件拉取下来，确保 CMake 绝不踩空
      - name: Download Build Folder & Presets
        uses: actions/download-artifact@v4
        with:
          name: build-assets-${{ matrix.os }}

      - name: Install Build Tools (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      # ---------------- Linux 编译流程 ----------------
      - name: Configure & Build (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cmake --preset conan-release -DCMAKE_PREFIX_PATH=build/generators
          cmake --build --preset conan-release --parallel
          ctest --preset conan-release --output-on-failure

      # ---------------- Windows 编译流程 ----------------
      - name: Configure & Build (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          cmake --preset conan-default -DCMAKE_PREFIX_PATH=build/generators
          cmake --build --preset conan-default --config Release --parallel
          ctest --preset conan-default --config Release --output-on-failure