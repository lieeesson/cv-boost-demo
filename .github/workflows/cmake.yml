name: CMake Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Conan
        run: pip install --quiet conan

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      # 【优化】为 Linux 的 Conan 依赖建立持久化缓存，避免每次都可能发生的漫长编译
      - name: Conan Cache
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: ${{ runner.os }}-conan-${{ hashFiles('conandata.yml', 'conanfile.txt', 'conanfile.py') }}
          restore-keys: |
            ${{ runner.os }}-conan-

      - name: Install deps via Conan
        run: |
          conan profile detect --force
          # 精简 OpenCV 依赖，拒绝拉取 ffmpeg 和系统 GTK，实现纯二进制纯秒级下载
          conan install . --build=missing \
            -s build_type=Release \
            -s os=Linux \
            -s arch=x86_64 \
            -o opencv/*:with_ffmpeg=False \
            -o opencv/*:with_gtk=False \
            --output-folder=build

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=build/generators/conan_toolchain.cmake

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Conan
        run: pip install --quiet conan

      # 【优化】为 Windows 的 Conan 依赖建立持久化缓存
      - name: Conan Cache
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: ${{ runner.os }}-conan-${{ hashFiles('conandata.yml', 'conanfile.txt', 'conanfile.py') }}
          restore-keys: |
            ${{ runner.os }}-conan-

      - name: Install deps via Conan
        shell: pwsh
        run: |
          conan profile detect --force
          # 同样在 Windows 端关闭 ffmpeg 捆绑，彻底避开 MSYS2 编译环境报错
          conan install . --build=missing -s build_type=Release -s os=Windows -s arch=x86_64 -o opencv/*:with_ffmpeg=False --output-folder=build

      - name: Configure CMake
        shell: pwsh
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=build/generators/conan_toolchain.cmake

      - name: Build
        shell: pwsh
        run: cmake --build build --parallel

      - name: Test
        shell: pwsh
        run: ctest --test-dir build --output-on-failure